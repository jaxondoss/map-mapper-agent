[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "madmapper-agent"
version = "0.1.0"
description = "Control MadMapper over OSC with plain-English instructions, driven by Claude."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.0",
    "python-osc>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
madmapper-agent = "madmapper_agent.cli:main"

[tool.setuptools]
packages = ["madmapper_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
