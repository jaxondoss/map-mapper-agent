<script type="module">

import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const V3 = THREE.Vector3, Q = THREE.Quaternion;
const params = new URLSearchParams(location.search);
const DEV = params.has("dev");
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const SPEED = REDUCED ? 0.5 : 1;
const LOOP = 20;
const BEATS = [0, 5, 8, 11, 13, 19];
const HAND_URL = "https://cdn.jsdelivr.net/npm/@webxr-input-profiles/assets@1.0/dist/profiles/generic-hand/right.glb";
const HAND_SCALE = 2.2;          // the model is in meters; the arm is drawn larger than life
const CELL = 0.00625;            // lattice cell in hand meters: ~120 cells along the whole arm
const DEG = Math.PI / 180;

// ------------------------------------------------------------------ color
// ACES + exposure would shift every authored hex. untone() inverts three's
// ACESFilmic fit so a flat surface lands on its hex on screen (saturated hues
// clamp to the closest reachable color).
const EXPOSURE = 1.1;
const ACES_IN = new THREE.Matrix3().set(0.59719, 0.35458, 0.04823, 0.07600, 0.90834, 0.01566, 0.02840, 0.13383, 0.83777);
const ACES_OUT = new THREE.Matrix3().set(1.60475, -0.53108, -0.07367, -0.10208, 1.10813, -0.00605, -0.00327, -0.07276, 1.07602);
const ACES_IN_INV = ACES_IN.clone().invert(), ACES_OUT_INV = ACES_OUT.clone().invert();
function invFit(x) {
  x = Math.min(Math.max(x, 0), 1.0);
  const a = 1 - 0.983729 * x, b = 0.0245786 - 0.432951 * x, c = -(0.000090537 + 0.238081 * x);
  return (-b + Math.sqrt(b * b - 4 * a * c)) / (2 * a);
}
function untone(hex, gain = 1) {
  const c = new THREE.Color(hex);                      // linear sRGB
  const x = new V3(c.r, c.g, c.b).applyMatrix3(ACES_OUT_INV);
  const y = new V3(invFit(x.x), invFit(x.y), invFit(x.z)).applyMatrix3(ACES_IN_INV);
  const k = 0.6 / EXPOSURE * gain;
  return new THREE.Color(Math.max(0, y.x * k), Math.max(0, y.y * k), Math.max(0, y.z * k));
}
const COL = {
  wallTop: untone("#7c8a7a"), wallBot: untone("#5f6d60"), weave: untone("#c9b089"),
  fill: untone("#0078D8"), line: untone("#18C0F0"), rim: untone("#7FE8FF"), hot: untone("#E6FBFF"),
  orbCore: untone("#F2FF3A"), orbEdge: untone("#C8F000"),
  mint: untone("#B8FFF0"), mintFill: untone("#2a5a55"),
};
const LAMP_STATES = {
  off:   { core: new THREE.Color(0, 0, 0), halo: new THREE.Color(0, 0, 0), on: 0, tint: 0 },
  fire:  { core: untone("#FF5A12"), halo: untone("#D84818"), on: 1, tint: 0.15 },
  red:   { core: untone("#F00018"), halo: untone("#901818"), on: 1, tint: 1.0 },

  green: { core: untone("#1EE06A", 0.62), halo: untone("#14A04A"), on: 1, tint: 0.9 },
  warm:  { core: untone("#FFD9A0", 0.72), halo: untone("#E89A50"), on: 1, tint: 0.35 },
};

document.body.prepend(renderer.domElement);

const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 60);
const BLOOM = { value: 0 };      // 1 while rendering the bloom-only pass
const TIME = { value: 0 };

// The composition is designed around this box on the wall (meters); the
// camera always fits it, and everything outside is extra wall.
const SAFE = { l: -0.55, r: 0.65, b: -0.42, t: 0.42 };
const view = { l: 0, r: 0, b: 0, t: 0, pxPerM: 1 };
const LAMP_POS = new V3(-0.30, -0.20, 0.035);
const SHADE = { w: 0.17, h: 0.13 };

// ------------------------------------------------------------------ shaders
const COMMON_GLSL = /* glsl */`
  float aaStep(float edge, float x) { float w = fwidth(x); return smoothstep(edge - w, edge + w, x); }
`;

// Wall: sage gradient, vignette, crown molding, lamp light, calibration grid.
const wallMat = new THREE.ShaderMaterial({
  uniforms: {
    uView: { value: new THREE.Vector4() }, uTop: { value: COL.wallTop }, uBot: { value: COL.wallBot },
    uLampPos: { value: LAMP_POS }, uLampCol: { value: new THREE.Color() }, uLampI: { value: 0 }, uTint: { value: 0 },
    uHinv: { value: new THREE.Matrix3() }, uGridOn: { value: 0 }, uGridFade: { value: 0 }, uCells: { value: new THREE.Vector2(12, 8) },
    uHi: { value: new THREE.Vector4(-9, -9, 0, 0) }, uHiSize: { value: new THREE.Vector2(1, 1) }, uMint: { value: COL.mint }, uMintFill: { value: COL.mintFill }, uBloom: BLOOM,
  },
  vertexShader: /* glsl */`varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: /* glsl */`
    uniform vec4 uView; uniform vec3 uTop, uBot, uLampPos, uLampCol, uMint, uMintFill;
    uniform float uLampI, uTint, uGridOn, uGridFade, uBloom; uniform mat3 uHinv; uniform vec2 uCells; uniform vec4 uHi; uniform vec2 uHiSize;
    varying vec3 vW;
    void main() {
      vec2 p = vW.xy;
      float vy = clamp((p.y - uView.y) / (uView.w - uView.y), 0.0, 1.0);
      vec3 wall = mix(uBot, uTop, smoothstep(0.0, 1.0, vy));
      // crown molding: a light edge, a shadow line under it, ceiling above
      float my = uView.w - 0.075 * (uView.w - uView.y);
      float py = fwidth(p.y);
      float above = smoothstep(my - py, my + py, p.y);
      wall *= mix(1.0, 1.07, above);
      float edge = 1.0 - smoothstep(0.0, 1.5 * py, abs(p.y - my));
      float shadowLine = 1.0 - smoothstep(0.0, 1.5 * py, abs(p.y - (my - 0.010)));
      float underShade = exp(-max(0.0, my - p.y) / 0.03) * (1.0 - above);
      wall *= 1.0 - 0.05 * underShade - 0.10 * shadowLine;
      wall += wall * 0.10 * edge;
      // vignette
      vec2 c = (p - 0.5 * (uView.xy + uView.zw)) / (0.5 * (uView.zw - uView.xy));
      wall *= 1.0 - 0.10 * smoothstep(0.5, 1.5, length(c));
      // lamp light: a soft cone spilling up and down the wall plus a wider tint wash
      vec2 d = p - uLampPos.xy;
      float w = 0.06 + 0.5 * abs(d.y);
      float cone = (1.0 - smoothstep(0.35 * w, w, abs(d.x))) * exp(-abs(d.y) / 0.5);
      float pool = exp(-dot(d, d) / 0.05);
      float wash = exp(-length(d) / 0.8) + above * 0.7 * exp(-abs(d.x) / 1.0);
      vec3 light = uLampCol * uLampI * (0.9 * cone + 0.7 * pool + uTint * 0.55 * wash);
      vec3 col = wall + wall * light * 2.2 + light * 0.32;
      // calibration grid (projective map of the unit square)
      vec3 h = uHinv * vec3(p, 1.0);
      vec2 uv = h.xy / h.z;
      vec3 grid = vec3(0.0);
      if (uGridOn > 0.001 && h.z > 0.0 && uv.x >= 0.0 && uv.y >= 0.0 && uv.x <= 1.0 && uv.y <= 1.0) {
        vec2 q = uv * uCells;
        vec2 fw = max(fwidth(q), vec2(1e-5));
        vec2 dl = abs(fract(q - 0.5) - 0.5) / fw;                       // pixels to nearest line
        vec2 de = min(q, uCells - q) / fw;                              // pixels to the border
        float pxd = min(min(dl.x, dl.y), min(de.x, de.y));
        float lineA = clamp(1.25 - pxd, 0.0, 1.0);
        float r = max(abs(uv.x - 0.5), abs(uv.y - 0.5)) * 2.0;          // 0 center .. 1 edge
        float edgeT = 1.02 - 1.06 * uGridFade;
        float mask = 1.0 - smoothstep(edgeT - fwidth(r), edgeT + fwidth(r), r);
        vec2 hd = abs(q - uHi.xy) - 0.5 * uHiSize;
        float inHi = 1.0 - smoothstep(-fw.x, fw.x, max(hd.x, hd.y));
        grid = (uMintFill * 0.4 + uMint * lineA * 0.85 + uMint * inHi * (0.3 * uHi.z + 0.55 * uHi.w)) * mask * uGridOn;
      }
      col += grid;
      if (uBloom > 0.5) col = grid * 0.2;
      gl_FragColor = vec4(col, 1.0);
    }`,
});
const wall = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), wallMat);
scene.add(wall);

// Lamp: a sconce with a woven rounded-rectangle shade, a flame, and a halo.
const lampMat = new THREE.ShaderMaterial({
  uniforms: {
    uSize: { value: new THREE.Vector2(SHADE.w, SHADE.h + 0.09) }, uWeave: { value: COL.weave },
    uCore: { value: new THREE.Color() }, uI: { value: 0 }, uFlame: { value: 0 }, uTime: TIME, uBloom: BLOOM,
    uMint: { value: COL.mint }, uCalib: { value: 0 },
  },
  vertexShader: /* glsl */`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: /* glsl */`
    uniform vec2 uSize; uniform vec3 uWeave, uCore, uMint; uniform float uI, uFlame, uTime, uBloom, uCalib;
    varying vec2 vUv;
    float sdRR(vec2 p, vec2 b, float r) { vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
    float hash(float n) { return fract(sin(n) * 43758.5453); }
    float noise(float x) { float i = floor(x), f = fract(x); return mix(hash(i), hash(i + 1.0), f * f * (3.0 - 2.0 * f)); }
    void main() {
      vec2 p = (vUv - 0.5) * uSize;                                  // meters; the shade is centered at y = -0.045
      vec2 sp = p - vec2(0.0, -0.045);
      vec2 half_ = vec2(${(SHADE.w / 2).toFixed(4)}, ${(SHADE.h / 2).toFixed(4)});
      float d = sdRR(sp, half_ - 0.003, 0.03);
      float aa = fwidth(d);
      float shade = 1.0 - smoothstep(-aa, aa, d);
      // mounting arm and backplate above the shade
      float plate = 1.0 - smoothstep(-aa, aa, sdRR(p - vec2(0.0, 0.075), vec2(0.026, 0.016), 0.006));
      float stem = 1.0 - smoothstep(-aa, aa, sdRR(p - vec2(0.0, 0.040), vec2(0.004, 0.024), 0.002));
      float metal = max(plate, stem) * (1.0 - shade);
      if (shade + metal < 0.002) discard;
      // basket weave: alternating horizontal and vertical strands
      vec2 wv = sp / 0.011;
      vec2 cell = floor(wv), f = fract(wv);
      bool horiz = mod(cell.x + cell.y, 2.0) < 0.5;
      float across = horiz ? f.y : f.x;
      float strand = smoothstep(0.0, 0.16, across) * smoothstep(1.0, 0.84, across);
      float round_ = sin(3.14159 * across);
      vec3 base = uWeave * (0.82 + 0.26 * round_) * mix(0.6, 1.0, strand);
      base *= 1.0 - 0.28 * smoothstep(-0.012, 0.0, d);                // darker rim
      // light from inside: strands glow, gaps glow more
      vec2 lc = sp / half_;
      float inner = exp(-dot(lc * vec2(0.9, 1.25), lc * vec2(0.9, 1.25)) * 1.1);
      vec3 emis = uCore * uI * (0.55 + 0.45 * inner) * (0.78 * strand + 1.0 * (1.0 - strand));
      // flame: a flickering teardrop seen through the weave
      float fl = 0.0;
      if (uFlame > 0.001) {
        float t = uTime;
        vec2 fp = sp - vec2(0.004 * (noise(t * 7.0) - 0.5), -0.022);
        float hgt = 0.045 * (0.88 + 0.22 * noise(t * 9.0 + 3.0));
        float yy = clamp(fp.y / hgt, -0.4, 1.2);
        float wdt = 0.017 * (1.0 - smoothstep(0.0, 1.0, yy)) * (0.9 + 0.2 * noise(t * 13.0)) + 0.002;
        float fd = abs(fp.x + 0.004 * sin(fp.y * 120.0 + t * 14.0) * yy) - wdt;
        fd = max(fd, max(-fp.y, fp.y - hgt));
        fd = min(fd, length(fp - vec2(0.0, 0.002)) - 0.0175 * (0.94 + 0.12 * noise(t * 11.0)));   // rounded base
        fl = (1.0 - smoothstep(-aa, aa, fd)) * uFlame;
      }
      vec3 flameCol = mix(uCore, vec3(1.0, 0.85, 0.55), 0.1) * 0.9 * fl * (0.55 + 0.45 * (1.0 - strand));
      vec3 metalCol = vec3(0.09, 0.08, 0.06) * (0.8 + 0.4 * smoothstep(0.0, 0.03, p.y - 0.05));
      base *= 1.0 - 0.93 * clamp(uI, 0.0, 1.0);                       // the lit shade glows instead of reflecting
      vec3 calib = uMint * uCalib * 0.55 * (shade + metal);                 // the projector's highlight landing on the lamp
      vec3 col = (base + emis + flameCol) * shade + metalCol * metal + calib;
      if (uBloom > 0.5) col = (emis * 0.3 + flameCol * 0.4) * shade + calib * 0.3;
      gl_FragColor = vec4(col, 1.0);
    }`,
});
const lamp = new THREE.Mesh(new THREE.PlaneGeometry(SHADE.w, SHADE.h + 0.09), lampMat);
lamp.position.copy(LAMP_POS).add(new V3(0, 0.045, 0));
scene.add(lamp);

function glowSprite(size, z) {
  const m = new THREE.ShaderMaterial({
    uniforms: { uCol: { value: new THREE.Color() }, uI: { value: 0 }, uBloom: BLOOM, uSharp: { value: 1 } },
    vertexShader: /* glsl */`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: /* glsl */`
      uniform vec3 uCol; uniform float uI, uBloom, uSharp; varying vec2 vUv;
      void main() { float r = length(vUv - 0.5) * 2.0; float g = exp(-r * r * 5.0 * uSharp) * (1.0 - smoothstep(0.8, 1.0, r));
        gl_FragColor = vec4(uCol * uI * g * (uBloom > 0.5 ? 0.0 : 1.0), 1.0); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(size, size), m);
  mesh.position.z = z;
  return mesh;
}
const lampHalo = glowSprite(0.9, 0.02);
lampHalo.position.set(LAMP_POS.x, LAMP_POS.y, 0.02);
scene.add(lampHalo);

// Orb: a crisp disc with a yellow-green gradient, plus a soft halo.
const orbMat = new THREE.ShaderMaterial({
  uniforms: { uCore: { value: COL.orbCore }, uEdge: { value: COL.orbEdge }, uI: { value: 1 }, uBloom: BLOOM },
  vertexShader: /* glsl */`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: /* glsl */`
    uniform vec3 uCore, uEdge; uniform float uI, uBloom; varying vec2 vUv;
    void main() {
      vec2 q = (vUv - 0.5) * 2.0; float r = length(q);
      float aa = fwidth(r);
      float disc = 1.0 - smoothstep(1.0 - aa, 1.0 + aa, r);
      if (disc <= 0.0) discard;
      vec3 c = mix(uCore, uEdge, smoothstep(0.2, 1.0, r));
      c += vec3(0.25) * exp(-dot(q - vec2(-0.3, 0.35), q - vec2(-0.3, 0.35)) * 14.0);
      if (uBloom > 0.5) c *= 0.3;
      gl_FragColor = vec4(c * uI * disc, disc * uI);
    }`,
  transparent: true, depthWrite: false,
  blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
});
const orb = new THREE.Mesh(new THREE.PlaneGeometry(0.09, 0.09), orbMat);
const orbHalo = glowSprite(0.42, 0);
orbHalo.material.uniforms.uCol.value = COL.orbEdge;
const orbGroup = new THREE.Group();
orbGroup.add(orbHalo, orb);
orb.position.z = 0.001;
scene.add(orbGroup);

// Bolts: short streaks with a motion-trail gradient.
const boltMat = new THREE.ShaderMaterial({
  uniforms: { uCol: { value: new THREE.Color() }, uI: { value: 0 }, uBloom: BLOOM },
  vertexShader: /* glsl */`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: /* glsl */`
    uniform vec3 uCol; uniform float uI, uBloom; varying vec2 vUv;
    void main() {
      float u = vUv.x, v = abs(vUv.y - 0.5) * 2.0;
      float taper = mix(0.25, 1.0, u);
      float aa = fwidth(v);
      float core = 1.0 - smoothstep(0.3 * taper - aa, 0.3 * taper + aa, v);
      float glow = exp(-v * v / (0.22 * taper)) * 0.6;
      float trail = pow(u, 1.6);
      vec3 c = (mix(uCol * 1.6, vec3(1.0, 0.97, 0.9) * 2.2, core * smoothstep(0.6, 1.0, u)) * core + uCol * glow) * trail * uI;
      gl_FragColor = vec4(c, 1.0);
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});
const bolt = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), boltMat);
scene.add(bolt);

// The hand material: deep-blue fill, a 1-device-pixel lattice with brighter
// intersection dots, and a tight fresnel rim that whitens at fingertips.
// Lines and rim add light; the fill uses premultiplied alpha so it dims the
// wall a little underneath, which keeps the blue saturated on a sage wall.
function makeHandMaterial() {
  return new THREE.ShaderMaterial({
    uniforms: {
      uCell: { value: CELL }, uTime: TIME, uBloom: BLOOM,
      uFill: { value: COL.fill }, uLine: { value: COL.line }, uRim: { value: COL.rim }, uHot: { value: COL.hot },
      uFillA: { value: 0.55 }, uLampPos: { value: LAMP_POS }, uLampCol: { value: new THREE.Color() },
      uOrbPos: { value: new V3() }, uOrbCol: { value: new THREE.Color() }, uTube: { value: 0 }, uTubeLen: { value: 1 }, uTubeV0: { value: 0 },
    },
    vertexShader: /* glsl */`
      #include <common>
      #include <skinning_pars_vertex>
      attribute vec2 aLat; attribute float aTip; attribute float aFade;
      uniform float uTube, uTubeLen, uTubeV0;
      varying vec2 vLat; varying float vTip; varying float vFade; varying vec3 vN; varying vec3 vV; varying vec3 vW;
      void main() {
        #include <skinbase_vertex>
        #include <beginnormal_vertex>
        #include <skinnormal_vertex>
        #include <begin_vertex>
        #include <skinning_vertex>
        vec4 mv = modelViewMatrix * vec4(transformed, 1.0);
        vN = normalize(normalMatrix * objectNormal);
        vV = normalize(-mv.xyz);
        vW = (modelMatrix * vec4(transformed, 1.0)).xyz;
        vLat = aLat;
        if (uTube > 0.5) vLat.y = uTubeV0 + aLat.y * uTubeLen;
        vTip = aTip; vFade = aFade;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: /* glsl */`
      uniform float uCell, uTime, uBloom, uFillA; uniform vec3 uFill, uLine, uRim, uHot, uLampPos, uLampCol, uOrbPos, uOrbCol;
      varying vec2 vLat; varying float vTip; varying float vFade; varying vec3 vN; varying vec3 vV; varying vec3 vW;
      void main() {
        vec2 g = vLat / uCell;
        vec2 fw = max(fwidth(g), vec2(1e-6));
        vec2 dl = abs(fract(g - 0.5) - 0.5) / fw;                   // device pixels to each line family
        float cellPx = 1.0 / max(fw.x, fw.y);
        float density = smoothstep(2.5, 5.0, cellPx);               // fade the lattice before it can moire
        float lineA = clamp(1.0 - min(dl.x, dl.y) + 0.35, 0.0, 1.0) * density;
        float dotA = clamp(1.9 - length(dl), 0.0, 1.0) * density;
        vec3 n = normalize(gl_FrontFacing ? vN : -vN);
        float fres = pow(1.0 - clamp(abs(dot(n, normalize(vV))), 0.0, 1.0), 3.5);
        vec3 rimCol = mix(uRim, uHot, clamp(vTip * (0.4 + fres), 0.0, 1.0));
        // fingertips pick up nearby light (lamp, orb)
        float nearLamp = exp(-length(vW.xy - uLampPos.xy) / 0.09);
        float nearOrb = exp(-length(vW - uOrbPos) / 0.07);
        vec3 pick = uLampCol * nearLamp * 1.6 + uOrbCol * nearOrb * 1.2;
        rimCol = mix(rimCol, rimCol * 0.35 + pick, clamp(length(pick), 0.0, 0.85));
        float scan = 1.0 + 0.025 * smoothstep(0.6, 1.0, sin(vLat.y * 22.0 - uTime * 1.6));
        float face = gl_FrontFacing ? 1.0 : 0.35;
        vec3 glow = (uLine * lineA * 0.85 + uHot * dotA * 0.5 + rimCol * fres * 1.05 + pick * vTip * 0.5) * face;
        // bloom only sees the thin bright features, so the halo hugs the lines
        vec3 bloomIn = (uLine * lineA * 0.05 + uHot * dotA * 0.08 + rimCol * fres * fres * 0.5 + pick * vTip * 0.35) * (gl_FrontFacing ? 1.0 : 0.0);
        vec3 fill = uFill * uFillA * face;
        float a = uFillA * face * vFade;
        vec3 col = (fill + glow) * scan * vFade;
        if (uBloom > 0.5) { col = bloomIn * scan * vFade; a = 0.0; }
        gl_FragColor = vec4(col, a);
      }`,
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
    blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneMinusSrcAlphaFactor,
  });
}

// ------------------------------------------------------------------ hand rig
const REST = {"wrist":[[0.03913,0.05578,0.00916],[-0.5,-0.5,-0.5,0.5]],"thumb-metacarpal":[[0.01997,0.01982,-0.01887],[-0.46433,0.15826,-0.20937,0.84588]],"thumb-phalanx-proximal":[[0.00482,-0.00344,-0.0358],[-0.41827,0.03519,-0.25594,0.87081]],"thumb-phalanx-distal":[[-0.00459,-0.02735,-0.05776],[-0.34497,0.10875,-0.20858,0.90866]],"thumb-tip":[[-0.00979,-0.0359,-0.06874],[-0.34349,0.11417,-0.21483,0.9071]],"index-finger-metacarpal":[[0.03206,0.02656,-0.00101],[-0.48021,-0.45486,-0.52195,0.53858]],"index-finger-phalanx-proximal":[[0.03181,-0.03277,-0.01439],[-0.54258,-0.4637,-0.50293,0.4875]],"index-finger-phalanx-intermediate":[[0.02858,-0.07798,-0.01286],[-0.53727,-0.48696,-0.50762,0.46533]],"index-finger-phalanx-distal":[[0.02636,-0.10214,-0.01153],[-0.5076,-0.54229,-0.46313,0.48351]],"index-finger-tip":[[0.02697,-0.11364,-0.01027],[-0.51251,-0.54771,-0.45804,0.47703]],"middle-finger-metacarpal":[[0.03307,0.02667,0.00573],[-0.46226,-0.51364,-0.54178,0.47851]],"middle-finger-phalanx-proximal":[[0.03658,-0.03587,0.00743],[-0.54521,-0.5015,-0.50516,0.44278]],"middle-finger-phalanx-intermediate":[[0.0321,-0.08234,0.0118],[-0.54774,-0.51861,-0.49601,0.43011]],"middle-finger-phalanx-distal":[[0.02933,-0.10958,0.01484],[-0.48415,-0.57865,-0.46407,0.46411]],"middle-finger-tip":[[0.03036,-0.12163,0.01646],[-0.48041,-0.57643,-0.46897,0.46583]],"ring-finger-metacarpal":[[0.03307,0.02878,0.01725],[-0.47072,-0.58544,-0.53068,0.3925]],"ring-finger-phalanx-proximal":[[0.0326,-0.02892,0.02662],[-0.5545,-0.55379,-0.48807,0.38423]],"ring-finger-phalanx-intermediate":[[0.02824,-0.07054,0.03592],[-0.54599,-0.57863,-0.49128,0.35457]],"ring-finger-phalanx-distal":[[0.02496,-0.09611,0.04235],[-0.51224,-0.57657,-0.50312,0.38993]],"ring-finger-tip":[[0.02418,-0.1078,0.04468],[-0.51067,-0.57727,-0.50577,0.38752]],"pinky-finger-metacarpal":[[0.02971,0.0217,0.03216],[-0.45937,-0.64297,-0.53477,0.29932]],"pinky-finger-phalanx-proximal":[[0.02543,-0.01812,0.04421],[-0.51803,-0.58073,-0.52452,0.34537]],"pinky-finger-phalanx-intermediate":[[0.02101,-0.05163,0.05152],[-0.51596,-0.62642,-0.49964,0.30289]],"pinky-finger-phalanx-distal":[[0.01815,-0.07063,0.05811],[-0.48438,-0.62121,-0.5096,0.34609]],"pinky-finger-tip":[[0.01736,-0.08213,0.06109],[-0.49811,-0.63159,-0.49632,0.32656]]};            // joint rest transforms from right.glb (armature space)
const FINGERS = ["thumb", "index", "middle", "ring", "pinky"];
const chainOf = f => f === "thumb"
  ? ["thumb-metacarpal", "thumb-phalanx-proximal", "thumb-phalanx-distal", "thumb-tip"]
  : [`${f}-finger-metacarpal`, `${f}-finger-phalanx-proximal`, `${f}-finger-phalanx-intermediate`, `${f}-finger-phalanx-distal`, `${f}-finger-tip`];
const JOINTS = ["wrist", ...FINGERS.flatMap(chainOf)];
const PARENT = { wrist: null };
for (const f of FINGERS) chainOf(f).forEach((n, i, c) => { PARENT[n] = i === 0 ? "wrist" : c[i - 1]; });

function restFrom(get) {
  const rest = {};
  for (const n of JOINTS) { const [p, q] = get(n); rest[n] = { p: new V3(...p), q: new Q(...q).normalize() }; }
  const W = rest.wrist.p;
  const F = rest["middle-finger-phalanx-proximal"].p.clone().sub(W).normalize();
  const Lr = rest["index-finger-phalanx-proximal"].p.clone().sub(rest["pinky-finger-phalanx-proximal"].p).normalize();
  const N = new V3().crossVectors(Lr, F).normalize();           // palm normal (fingers curl toward it)
  const L = new V3().crossVectors(N, F).normalize();            // toward the pinky side; (L, N, F) is right-handed
  const basis = new THREE.Matrix4().makeBasis(L, N, F);
  const local = {}, axes = {};
  for (const n of JOINTS) {
    const par = PARENT[n];
    if (!par) { local[n] = { p: rest[n].p.clone(), q: rest[n].q.clone() }; continue; }

// Lattice coordinates (around, along) and tip-ness for every vertex, in bind pose.

function fromGltf(gltf, source) {
  let mesh = null;
  gltf.scene.traverse(o => { if (o.isSkinnedMesh) mesh = o; });

  const bones = {};
  mesh.skeleton.bones.forEach(b => { bones[b.name] = b; });
  for (const n of JOINTS) if (!bones[n]) throw new Error("missing joint " + n);
  const rig = restFrom(n => [bones[n].position.toArray(), bones[n].quaternion.toArray()]);

async function loadHand() {
  const mode = params.get("hand");                       // "procedural" or "embedded" force a path
  if (mode !== "procedural") {
    const loader = new GLTFLoader();
    if (mode !== "embedded") {
      try {
        const g = await Promise.race([loader.loadAsync(HAND_URL), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 4000))]);
        return fromGltf(g, "cdn");
      } catch (e) { if (DEV) console.info("hand: CDN load failed, trying the embedded copy", e.message); }
    }
    try {
      const b64 = document.getElementById("hand-glb").textContent.trim();
      const bytes = Uint8Array.from(atob(b64), ch => ch.charCodeAt(0));
      const g = await new Promise((res, rej) => loader.parse(bytes.buffer, "", res, rej));
      return fromGltf(g, "embedded");
    } catch (e) { if (DEV) console.info("hand: embedded copy failed, using the procedural hand", e); }
  }
  return proceduralHand();
}

  const halfW0 = (SAFE.r - SAFE.l) / 2, halfH0 = (SAFE.t - SAFE.b) / 2;
  const halfH = Math.max(halfH0, halfW0 / aspect), halfW = halfH * aspect;
  const cx = (SAFE.l + SAFE.r) / 2, cy = (SAFE.b + SAFE.t) / 2, D = halfH / tanH;
  camera.aspect = aspect; camera.position.set(cx, cy, D); camera.lookAt(cx, cy, 0); camera.updateProjectionMatrix();
  Object.assign(view, { l: cx - halfW, r: cx + halfW, b: cy - halfH, t: cy + halfH, pxPerM: h * dpr / (2 * halfH) });
  wallMat.uniforms.uView.value.set(view.l, view.b, view.r, view.t);
  buildTracks(); buildGrid();
  orbSim.phase = -1;
}

// ------------------------------------------------------------------ clock, controls, HUD
let simT = 0, acc = 0, last = performance.now(), playing = !params.has("pause"), dirty = true;
const hud = document.getElementById("hud");
let hudTimer = setTimeout(() => hud.classList.add("hide"), 3000);
function poke() { hud.classList.remove("hide"); clearTimeout(hudTimer); hudTimer = setTimeout(() => hud.classList.add("hide"), 3000); }
function seek(t) { simT = ((t % LOOP) + LOOP) % LOOP; acc = 0; orbSim.phase = -1; dirty = true; }
addEventListener("keydown", e => {
  if (e.code === "Space") { playing = !playing; e.preventDefault(); }
  else if (e.key === "r" || e.key === "R") seek(0);
  else if (/^[1-6]$/.test(e.key)) seek(BEATS[+e.key - 1]);
  else return;
  poke();
});
let fpsN = 0, fpsT = performance.now();
function render() {
  BLOOM.value = 1; bloomComposer.render();
  BLOOM.value = 0; finalComposer.render();
}
function frame(now) {
  let dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;   // clamped: a tab switch never jumps
  if (playing) { acc += dt * SPEED; while (acc >= STEP) { simT += STEP; acc -= STEP; } if (simT >= LOOP) seek(simT); }
  if (playing || dirty) { update(simT); render(); dirty = false; }   // a paused scene costs nothing
  if (DEV) { fpsN++; if (now - fpsT > 2000) { console.log(`fps ${(fpsN * 1000 / (now - fpsT)).toFixed(1)} · hand ${HAND?.source}`); fpsN = 0; fpsT = now; } }
  requestAnimationFrame(frame);
}

resize();
addEventListener("resize", () => { resize(); dirty = true; });
HAND = await loadHand();
scene.add(HAND.root);
if (DEV) console.log("hand source:", HAND.source);
if (DEV) window.__dbg = { evalArm, orbState, jointWorld, orbTarget, pose, view };
// test hooks: render an exact time without the clock
window.__scene = { seek: t => { seek(t); update(simT); render(); dirty = false; }, source: HAND.source, ready: true };
if (params.has("t")) { seek(+params.get("t")); playing = false; }
requestAnimationFrame(t => { last = t; frame(t); });
</script>
